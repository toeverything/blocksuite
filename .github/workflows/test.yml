name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run format check
        run: yarn lint:format

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Check dedupe
        run: yarn dedupe --check

      - name: Run build
        run: yarn build

  build-and-test:
    if: ${{ always() }}
    name: Build & Test
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: on error
        if: ${{ needs.lint.result != 'success' || needs.build.result != 'success' }}
        run: exit 1
